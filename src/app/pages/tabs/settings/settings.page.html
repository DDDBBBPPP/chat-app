<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-margin">
    <ion-list lines="none">
      <ion-item [detail]="true" class="borderBottom">
        <ion-avatar slot="start">
          <img [src]="'https://i.pravatar.cc/220'">
        </ion-avatar>

        <ion-label>Nicky Localll
          <p>Available</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-toggle [(ngModel)]="theme.paletteToggle" 
                    (ionChange)="theme.toggleChange($event)"
                    justify="space-between">
          Dark Mode
        </ion-toggle>
      </ion-item>
    </ion-list>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-button expand="block" 
                class="ion-margin-horizontal" 
                size="large"
                color="danger"
                (click)="auth.logout()"
                >
      <ion-text>
          LOGOUT
      </ion-text>
    </ion-button>
  </ion-toolbar>
  
</ion-footer>
